services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latexai-backend-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - API_PREFIX=/api/v1
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
      - LOG_LEVEL=debug
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key-for-local-development
      - SUPABASE_JWT_SECRET=super-secret-jwt-token-with-at-least-32-chars-long
      - COMPILER_SERVICE_URL=http://compiler:5050
      - ENABLE_CONFIG_ENDPOINT=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      compiler:
        condition: service_healthy

  compiler:
    build:
      context: ./compiler
      dockerfile: Dockerfile
    container_name: latexai-compiler-service
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - PORT=5050
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5050/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
